name: Check Env
on:
  push

env:
  STAGE_WORKFLOW: "workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAGE_JOB: "job" 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'oracle'
      - name: Check User
        run: echo "Usuario - ${{ github.actor }}" 
      - name: Check OS
        run: echo "Usuario - ${{ runner.os }}" 
      - name: Check Env Variable
        env:
          STAGE_STEP: "step" 
        run: echo "WORKFLOW - $STAGE_WORKFLOW / JOB - $STAGE_JOB / STEP - $STAGE_STEP" 