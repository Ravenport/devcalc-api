name: Check Env
on:
  push

env:
  STAGE_WORKFLOW: "workflow"
  STAGE_TEST_ISSUE: "Issue TP"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAGE_JOB: "job" 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'oracle'
      - name: Check User
        run: echo "Usuario - ${{ github.actor }}" 
      - name: Check OS
        run: echo "Usuario - ${{ runner.os }}" 
      - name: Check Env Variable
        env:
          STAGE_STEP: "step" 
        run: echo "WORKFLOW - $STAGE_WORKFLOW / JOB - $STAGE_JOB / STEP - $STAGE_STEP" 
  create-issue:
    if: ${{ env.STAGE_TEST_ISSUE == 'Issue TP' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Issue
        uses: JasonEtco/create-an-issue@v2
        with:
          title: "Issue para TP"
          body: "Essa $STAGE_TEST_ISSUE foi criada"
          labels: "bug,automation"
          assignees: "Ravenport"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dont-create-issue:
    if: ${{ env.STAGE_TEST_ISSUE != 'Issue TP' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Issue
        uses: JasonEtco/create-an-issue@v2
        with:
          title: "Issue para TP"
          body: "Essa $STAGE_TEST_ISSUE foi criada"
          labels: "bug,automation"
          assignees: "Ravenport"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
